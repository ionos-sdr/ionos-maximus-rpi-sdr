# /etc/wmbusmeters.conf — example: read telegrams from sniffd's rtl_wmbus FIFO
# wmbusmeters runs the given command and parses its stdout as rtl_wmbus
# lines (README: `rtlwmbus:CMD(<command line>)`). sniffd writes those lines
# to the FIFO; cat blocks on it, which is exactly the behaviour of a radio.
# Alternative without the FIFO (bench, WSTK USB CDC): run sniffd inside CMD:
#   device=rtlwmbus:CMD(/opt/ionos/venv/bin/sniffd --source serial:/dev/ttyACM0 --phy wmbus_tc --rtlwmbus -)
loglevel=normal
device=rtlwmbus:CMD(cat /run/ionos/wmbus.fifo)
logtelegrams=false
format=json
meterfiles=/var/lib/wmbusmeters/meter_readings
meterfilesaction=overwrite
logfile=/var/log/wmbusmeters/wmbusmeters.log
# Home Assistant / MQTT: pipe every JSON reading to mosquitto_pub
shell=/usr/bin/mosquitto_pub -h localhost -t "wmbusmeters/$METER_ID" -m "$METER_JSON"
