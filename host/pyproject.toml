[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ionos-tools"
version = "0.1.0"
description = "Raspberry Pi host tools for the ionos-maximus EFR32FG23 radio boards (sniffer daemon, wM-Bus helpers)"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
pi = ["spidev>=3.5", "gpiod>=1.5"]
test = ["pytest>=7"]

[project.scripts]
sniffd = "ionos_tools.sniffd:main"

[tool.setuptools]
packages = ["ionos_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
